<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pancake Party! 🥞 The Great Food Stack</title>
<meta name="description" content="A silly physics game for kids: catch and stack yummy toppings into a wobbly tower before Munchy eats them!">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥞</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="800"></canvas>

  <!-- HUD (in-game) -->
  <div id="hud" class="hidden">
    <div class="hud-row">
      <div id="hud-hearts" class="pill" title="Toppings Munchy has eaten">😋 0</div>
      <div id="hud-level" class="pill">🥞 Pancake Peak</div>
      <div id="hud-progress" class="pill">0 / 6</div>
    </div>
    <div class="hud-row hud-row2">
      <div id="hud-score" class="pill">⭐ 0</div>
      <div id="combo-badge" class="hidden">YUM! ×2</div>
      <button id="btn-quit" class="mini-btn" title="Back to map">🗺️</button>
    </div>
  </div>

  <!-- Title screen -->
  <div id="screen-title" class="screen">
    <div class="logo-wrap">
      <div class="logo-emoji">🥞</div>
      <h1 class="logo">Pancake<br>Party!</h1>
      <div class="tagline">The Great Food Stack</div>
    </div>
    <button id="btn-play" class="big-btn">▶ &nbsp;PLAY</button>
    <div class="hint">Drag to steer the plate and catch the falling toppings!<br>Tap to make the cloud drop early.</div>
  </div>

  <!-- Level select -->
  <div id="screen-levels" class="screen hidden">
    <h2 class="screen-title">Pick a dish!</h2>
    <div id="level-list"></div>
    <button id="btn-back-title" class="small-btn">◀ Back</button>
  </div>

  <!-- End screen (win / topple) -->
  <div id="screen-end" class="screen hidden">
    <div class="end-card">
      <div id="end-emoji" class="end-emoji">🎉</div>
      <h2 id="end-title">Dish complete!</h2>
      <div id="end-stars" class="end-stars">★★★</div>
      <div id="end-score" class="end-score">Score: 0</div>
      <div id="end-msg" class="end-msg"></div>
      <div class="end-btns">
        <button id="btn-retry" class="big-btn alt">↻ Again</button>
        <button id="btn-next" class="big-btn">Next ▶</button>
      </div>
      <button id="btn-map" class="small-btn">🗺️ Map</button>
    </div>
  </div>

  <button id="btn-mute" title="Sound on/off">🔊</button>
</div>

<script src="js/matter.min.js"></script>
<script src="js/game.js"></script>
</body>
</html>
